plugins {
    id("com.android.library")
    id("aaosApps.buildLogic")
    id 'kotlin-android'
}

android{
    defaultConfig {
        minSdkVersion 30
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true', coverage: 'true'
    }
    namespace "com.android.car.media.testmediaapp"

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        androidTest{
            java.srcDirs += 'tests/instrumenttests/src'
        }

        test {
            java.srcDirs += 'tests/unittests/src'
        }
    }

    signingConfigs {
        unbundled {
            storeFile file(gradle.ext.unbundledCertPath)
            storePassword 'carapps'
            keyAlias 'carapps'
            keyPassword 'carapps'
        }
    }

    flavorDimensions "signingkey"
    productFlavors {
        unbundled {
            dimension "signingkey"
            signingConfig signingConfigs.unbundled
        }
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        animationsDisabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.media:media:1.7.0'
    implementation "androidx.media3:media3-session:1.4.1"
    // Keep commented out except for experimenting locally with the latest media3 source
    // See github.com/androidx/media?tab=readme-ov-file#locally
    // implementation project(':media3-lib-session')
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.car.app:app:1.1.0'

    testImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation 'junit:junit:4.12'
    testImplementation libs.robolectric
    testImplementation "org.mockito:mockito-core:2.19.0"
    testImplementation 'androidx.test:runner:1.4.0'
    testImplementation 'androidx.test:rules:1.4.0'
    implementation project(":car-media-extensions")
}
