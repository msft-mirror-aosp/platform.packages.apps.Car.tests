plugins {
    id("com.android.application")
    id 'aaosApps.buildLogic'
    id 'kotlin-android'
}

android {
    namespace "com.android.car.media.testmediacalapp"
    defaultConfig {
        applicationId "com.android.car.media.testmediacalapp"
        minSdkVersion 30
        targetSdkVersion 34
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        unbundled {
            storeFile file(gradle.ext.unbundledCertPath)
            storePassword 'carapps'
            keyAlias 'carapps'
            keyPassword 'carapps'
        }
    }

    flavorDimensions "signingkey"
    productFlavors {
        unbundled {
            dimension "signingkey"
            signingConfig signingConfigs.unbundled
        }
    }

    buildTypes {
        debug {
            signingConfig android.buildTypes.release.signingConfig
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation(project(":test-media-app:common"))
    implementation libs.androidx.car.app.automotive
    // Keep commented out except for experimenting locally with the latest media3 source
    // See github.com/androidx/media?tab=readme-ov-file#locally
    // implementation project(':media3-lib-session')
    implementation libs.androidx.media
    implementation libs.androidx.media3.session
    implementation libs.androidx.appcompat
}
