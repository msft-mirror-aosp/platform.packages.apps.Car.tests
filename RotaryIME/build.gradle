plugins {
    id 'com.android.application'
    id 'buildSrc.jdk.jdk8'
}

android {
    namespace "com.android.car.rotaryime"
    compileSdkVersion gradle.ext.aaosLatestSDK
    defaultConfig {
        applicationId "com.android.car.rotaryime"
        minSdkVersion 30
        targetSdkVersion 33
        versionCode gradle.ext.getVersionCode()
        versionName gradle.ext.getVersionName()
    }

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        unbundled {
            storeFile file(gradle.ext.unbundledCertPath)
            storePassword 'carapps'
            keyAlias 'carapps'
            keyPassword 'carapps'
        }
    }

    flavorDimensions "signingkey"
    productFlavors {
        unbundled {
            dimension "signingkey"
            signingConfig signingConfigs.unbundled
        }
    }

    buildTypes {
        debug {
            signingConfig android.buildTypes.release.signingConfig
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    buildFeatures {
        renderScript true
        aidl true
    }
}

dependencies {
    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.constraintlayout:constraintlayout:2.0.0-beta8"
    implementation project(":car-ui-lib")
}
